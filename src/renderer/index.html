<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Binary Media Art</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <video id="videoElement" playsinline muted style="display: none"></video>
    <canvas id="hiddenCanvas" style="display: none"></canvas>

    <div id="visualStage" class="visual-stage">
      <canvas id="bgCanvas" class="bg-canvas"></canvas>
      <canvas id="binaryCanvas" class="binary-canvas"></canvas>
    </div>

    <div id="errorText" class="error-text" style="display: none"></div>

    <aside id="updateNotice" class="update-notice" aria-live="polite" style="display: none">
      <div class="update-notice__eyebrow">SYSTEM UPDATE</div>
      <div id="updateNoticeTitle" class="update-notice__title"></div>
      <p id="updateNoticeDetail" class="update-notice__detail"></p>
      <div id="updateNoticeActions" class="update-notice__actions" style="display: none">
        <button
          id="restartUpdateButton"
          class="update-notice__button update-notice__button--primary"
          type="button"
        >
          지금 재시작
        </button>
        <button id="laterUpdateButton" class="update-notice__button" type="button">나중에</button>
      </div>
    </aside>

    <div id="sideColumn" class="side-column">
      <div id="panelCards" class="panel-cards" aria-label="미디어 아트 안내 카드"></div>

      <!-- Sits at about mid-height between the explanation card and the bottom controls. -->
      <button
        id="valueToggle"
        class="mode-button value-toggle"
        type="button"
        aria-pressed="false"
        hidden
      >
        <span>픽셀별 빛의 세기 보기</span>
        <small id="valueToggleState"></small>
      </button>

      <div id="projectNote" class="project-note-slot"></div>

      <div id="modeControls" class="mode-controls" aria-label="미디어 아트 모드 컨트롤">
        <div class="mode-cue">보고 싶은 모드를 선택해주세요</div>
        <div
          id="liveModeButtons"
          class="mode-button-grid mode-button-grid--live"
          role="group"
          aria-label="미디어 아트 모드 선택"
        ></div>
        <div id="modeOptions" class="mode-options">
          <div id="modeOptionsLabel" class="mode-options-label"></div>
          <div
            id="modeOptionButtons"
            class="mode-button-grid mode-option-grid"
            role="group"
            aria-labelledby="modeOptionsLabel"
          ></div>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
