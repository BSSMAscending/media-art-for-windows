<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Binary Media Art</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <video id="videoElement" playsinline muted style="display: none;"></video>
    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <div id="overlayUI" class="overlay-ui">
      <div class="setup-copy">
        <div id="titleText" class="title-text">BINARY MEDIA ART</div>
        <div id="modelStatus" class="model-status" role="status">AI 모델 준비 중...</div>
        <p class="setup-kicker">미디어 아트란?</p>
        <p class="setup-description">카메라에 담긴 움직임을 픽셀과 숫자, 색의 언어로 다시 바라보는 인터랙티브 작업입니다.</p>
      </div>
      <div id="versionSelection" class="version-selection">
        <div class="setup-label">원하는 모드를 선택해주세요</div>
        <div id="setupModeButtons" class="mode-button-grid" role="group" aria-label="미디어 아트 모드 선택"></div>
        <div class="size-selection">
          <div class="setup-label">문자 크기를 선택해주세요</div>
          <div id="setupSizeButtons" class="size-button-grid" role="group" aria-label="문자 크기 선택"></div>
        </div>
      </div>
      <div id="cameraSelection" class="camera-selection">
        <label for="cameraSelect">카메라 선택:</label>
        <select id="cameraSelect" class="camera-select">
          <option value="">카메라 목록 로딩 중...</option>
        </select>
      </div>
      <div id="bgSelection" class="bg-selection">
        <label for="bgSelect">배경 효과:</label>
        <select id="bgSelect" class="bg-select">
          <option value="off">없음 (검정)</option>
          <option value="blue">파란 배경</option>
          <option value="matrix">매트릭스 숫자 흐름</option>
        </select>
      </div>
      <button id="startButton" class="start-button">START CAMERA</button>
      <button id="toggleFullscreenButton" class="window-mode-button" type="button" aria-pressed="false">
        전체 화면으로 전환
      </button>
      <div class="key-hints">
        [F] 필터 &nbsp;|&nbsp; [E] 설명
      </div>
      <div id="errorText" class="error-text" style="display: none;"></div>
    </div>

    <div id="visualStage" class="visual-stage">
      <canvas id="bgCanvas" class="bg-canvas"></canvas>
      <canvas id="binaryCanvas" class="binary-canvas" style="display: none;"></canvas>
    </div>

    <aside id="updateNotice" class="update-notice" aria-live="polite" style="display: none;">
      <div class="update-notice__eyebrow">SYSTEM UPDATE</div>
      <div id="updateNoticeTitle" class="update-notice__title"></div>
      <p id="updateNoticeDetail" class="update-notice__detail"></p>
      <div id="updateNoticeActions" class="update-notice__actions" style="display: none;">
        <button id="restartUpdateButton" class="update-notice__button update-notice__button--primary" type="button">
          지금 재시작
        </button>
        <button id="laterUpdateButton" class="update-notice__button" type="button">나중에</button>
      </div>
    </aside>

    <div id="modeControls" class="mode-controls" aria-label="미디어 아트 모드 컨트롤">
      <div class="mode-cue">변하고 싶은 미디어 아트 모드를 선택해주세요</div>
      <div class="live-controls-row">
        <div id="liveModeButtons" class="mode-button-grid mode-button-grid--live" role="group" aria-label="미디어 아트 모드 선택"></div>
        <div class="live-size-control">
          <div class="control-label">문자 크기</div>
          <div id="liveSizeButtons" class="size-button-grid" role="group" aria-label="문자 크기 선택"></div>
        </div>
      </div>
    </div>

    <div id="filterPanel" class="filter-panel" style="display: none;">
      <div class="filter-title">이미지 필터 [F키]</div>
      <div class="filter-row">
        <label>밝기: <span id="brightnessValue">0.00</span></label>
        <input type="range" id="brightnessSlider" min="-1" max="1" step="0.05" value="0" />
      </div>
      <div class="filter-row">
        <label>블러: <span id="blurValue">0</span></label>
        <input type="range" id="blurSlider" min="0" max="2" step="1" value="0" />
      </div>
      <div class="filter-row">
        <label>샤프닝: <span id="sharpenValue">0.0</span></label>
        <input type="range" id="sharpenSlider" min="0" max="1" step="0.1" value="0" />
      </div>
      <div class="filter-row">
        <label><input type="checkbox" id="edgeOverlayCheck" /> 엣지 오버레이</label>
      </div>
      <div class="filter-row">
        <label><input type="checkbox" id="maskCleanCheck" /> 마스크 정제</label>
      </div>
      <div class="filter-hint">[F] 패널 닫기</div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
