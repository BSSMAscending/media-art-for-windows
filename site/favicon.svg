<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" shape-rendering="crispEdges">
  <!-- .brand-mark in site/style.css: 3×3 cells of 6px with 2px gaps.
       Even cells use the accent at 0.25 opacity. -->
  <style>
    rect { fill: #00e5e5 }
    .dim { fill-opacity: 0.25 }
    @media (prefers-color-scheme: light) {
      rect { fill: #007c87 }
    }
  </style>
  <rect width="6" height="6" />
  <rect class="dim" x="8" width="6" height="6" />
  <rect x="16" width="6" height="6" />
  <rect class="dim" y="8" width="6" height="6" />
  <rect x="8" y="8" width="6" height="6" />
  <rect class="dim" x="16" y="8" width="6" height="6" />
  <rect y="16" width="6" height="6" />
  <rect class="dim" x="8" y="16" width="6" height="6" />
  <rect x="16" y="16" width="6" height="6" />
</svg>
