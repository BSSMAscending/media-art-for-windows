name: Release Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Restore signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}\windows-signing.pfx
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 GitHub Secret is not configured.'
          }

          [IO.File]::WriteAllBytes(
            $env:WINDOWS_CERTIFICATE_PATH,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )

      - name: Build signed installer
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}\windows-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/make/squirrel.windows/x64/
