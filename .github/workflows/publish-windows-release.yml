name: Publish Windows release

# Releases come from bump commits on main: a push whose package.json version has
# no vX.Y.Z tag yet builds the installer, publishes it, then tags that commit.
# Every other push to main finds the tag already there and skips.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  detect:
    name: detect version bump
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      previous-tag: ${{ steps.version.outputs.previous-tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package version with release tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          latest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous-tag=${latest:+v$latest}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version $version must be X.Y.Z to release."
            exit 1
          fi

          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::package.json version $version is lower than the latest release v$latest."
            exit 1
          fi

          echo "Bump commit found: publishing $tag (previous ${latest:+v$latest})."
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.detect.outputs.previous-tag }}
      RELEASE_REPOSITORY: BSSMAscending/media-art-for-windows-releases
      RELEASE_GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
      SOURCE_GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out bump commit
        uses: actions/checkout@v4

      - name: Verify release target
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_GH_TOKEN)) {
            throw 'RELEASES_REPOSITORY_TOKEN GitHub Secret is not configured.'
          }

          # A complete release without its source tag means an earlier run stopped
          # after uploading; tag that commit by hand instead of rebuilding over it.
          $env:GH_TOKEN = $env:RELEASE_GH_TOKEN
          $assets = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets -contains 'RELEASES') {
            throw "$env:RELEASE_TAG is already published but has no source tag. Push the $env:RELEASE_TAG tag to the released commit."
          }
          $global:LASTEXITCODE = 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build unsigned installer
        run: npm run make -- --platform=win32 --arch=x64

      - name: Publish public release assets
        shell: pwsh
        run: |
          $files = Get-ChildItem out/make/squirrel.windows/x64 -File | ForEach-Object FullName
          if ($files.Count -eq 0) {
            throw 'No Windows release artifacts were generated.'
          }

          # Release notes: the body of the PR that merged the bump commit, or
          # GitHub's generated list of merged PRs when it was pushed directly.
          $env:GH_TOKEN = $env:SOURCE_GH_TOKEN
          $pullRequests = @(
            gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" --paginate |
              ConvertFrom-Json
          )
          $bumpPullRequest = $pullRequests |
            Where-Object { $_.base.ref -eq 'main' -and $_.merged_at -and $_.merge_commit_sha -eq $env:GITHUB_SHA } |
            Select-Object -First 1
          $notes = $bumpPullRequest.body
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notesArgs = @('-f', "tag_name=$env:RELEASE_TAG", '-f', "target_commitish=$env:GITHUB_SHA")
            if ($env:PREVIOUS_TAG) {
              $notesArgs += @('-f', "previous_tag_name=$env:PREVIOUS_TAG")
            }
            $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" @notesArgs --jq '.body'
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not generate release notes.'
            }
            $notes = $notes -join "`n"
          }

          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $releaseNotesPath -Value $notes -NoNewline
          $releaseTitle = "$env:RELEASE_TAG Busan Mathematical Culture Center – Media Art"

          $env:GH_TOKEN = $env:RELEASE_GH_TOKEN
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --title $releaseTitle --notes-file $releaseNotesPath
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create $env:RELEASE_TAG in $env:RELEASE_REPOSITORY."
            }
          }

          gh release upload $env:RELEASE_TAG $files --repo $env:RELEASE_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the installer to $env:RELEASE_TAG."
          }

      - name: Tag the bump commit
        shell: pwsh
        run: |
          # Tagged last, so a failed run leaves no tag and the next run retries the release.
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the $env:RELEASE_TAG tag."
          }
