name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_REPOSITORY: BSSMAscending/media-art-for-windows-releases
      RELEASE_GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
      SOURCE_GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version and source branch
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_GH_TOKEN)) {
            throw 'RELEASES_REPOSITORY_TOKEN GitHub Secret is not configured.'
          }

          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $packageVersion."
          }

          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit already merged into main.'
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build unsigned installer
        run: npm run make -- --platform=win32 --arch=x64

      - name: Publish public release assets
        shell: pwsh
        run: |
          $files = Get-ChildItem out/make/squirrel.windows/x64 -File | ForEach-Object FullName
          if ($files.Count -eq 0) {
            throw 'No Windows release artifacts were generated.'
          }

          $env:GH_TOKEN = $env:SOURCE_GH_TOKEN
          $releasePullRequests = @(
            gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" --paginate |
              ConvertFrom-Json
          )
          $releasePullRequest = $releasePullRequests |
            Where-Object { $_.base.ref -eq 'main' -and $_.head.ref -eq 'dev' -and $_.merged_at } |
            Select-Object -First 1

          if ($null -eq $releasePullRequest) {
            throw 'No merged dev-to-main release pull request was found for this release tag.'
          }

          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $releaseNotesPath -Value $releasePullRequest.body -NoNewline
          $releaseTitle = "$env:GITHUB_REF_NAME Busan Mathematical Culture Center – Media Art"

          $env:GH_TOKEN = $env:RELEASE_GH_TOKEN
          gh release view $env:GITHUB_REF_NAME --repo $env:RELEASE_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:RELEASE_REPOSITORY --title $releaseTitle --notes-file $releaseNotesPath
          }

          gh release upload $env:GITHUB_REF_NAME $files --repo $env:RELEASE_REPOSITORY --clobber
