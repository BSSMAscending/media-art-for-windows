name: Publish beta

# Manual only. Builds a Windows beta and a Mac beta (Apple Silicon and Intel)
# and publishes both to BSSMAscending/media-art-beta. The Homebrew tap is
# updated when that repository exists; a missing tap does not block the files.
# It does not run on pushes to main, does not change package.json on main, and
# cannot upload to the exhibit repository media-art-for-windows-releases.
# Exhibit PCs keep updating from that repository alone.
#
# The release's title and notes are the beta's CHANGELOG.md entry, so that entry
# has to be on the branch before the run.
#
# The Mac betas are signed with one self-signed certificate kept in the secrets
# MAC_BETA_SIGNING_P12 and MAC_BETA_SIGNING_PASSWORD (scripts/create-mac-beta-signing-cert.sh),
# so macOS keeps the camera permission from one beta to the next.
#
# The release is created as a draft, the cask and the source tag follow, and the
# draft goes public last. A run that fails before that leaves nothing public and
# can be run again with the same version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta on the 2.0.0 line, for example 2.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

# The version is typed by whoever runs the workflow. It reaches every script as
# an environment variable and is never pasted into script text.
env:
  BETA_VERSION: ${{ inputs.version }}

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  guard:
    name: refuse the exhibit repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
    outputs:
      tap: ${{ steps.tap.outputs.state }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Accept only a beta version aimed away from the exhibit
        id: target
        run: |
          set -euo pipefail
          node scripts/release-target.js beta "$BETA_VERSION" | tee -a "$GITHUB_OUTPUT"

      # update.electronjs.org and the site's download buttons only see a public repository.
      - name: Require a public beta repository
        env:
          BETA_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASES_REPOSITORY_TOKEN is not configured."
            exit 1
          fi
          visibility=$(gh repo view "$BETA_REPOSITORY" --json visibility --jq .visibility)
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "::error::$BETA_REPOSITORY is $visibility. Make it public so Windows betas can update and testers can download."
            exit 1
          fi

      # A missing tap is fine. Any other failure (no access, a server error) is not,
      # so it cannot pass for "absent" and skip the cask silently.
      - name: Check the Homebrew tap
        id: tap
        env:
          TAP: ${{ steps.target.outputs.tap }}
        run: |
          set -euo pipefail
          if ! can_push=$(gh api "repos/$TAP" --jq .permissions.push 2>&1); then
            if [[ "$can_push" == *"HTTP 404"* ]]; then
              echo "::warning::Homebrew tap $TAP does not exist. The Mac and Windows files still publish."
              echo "state=absent" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not read Homebrew tap $TAP: $can_push"
            exit 1
          fi
          if [[ "$can_push" != "true" ]]; then
            echo "::error::RELEASES_REPOSITORY_TOKEN cannot push to $TAP. Fix its access before publishing."
            exit 1
          fi
          echo "state=present" >> "$GITHUB_OUTPUT"

      # Squirrel only offers an update that sorts higher, so the new beta has to be
      # numbered above every published one (source tags and the beta repository's
      # releases), not just differ from them. Unpublished drafts do not count.
      - name: Require a beta numbered above the published ones
        env:
          BETA_REPOSITORY: ${{ steps.target.outputs.repository }}
        run: |
          set -euo pipefail
          releases=$(gh release list --repo "$BETA_REPOSITORY" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')
          { git tag -l 'v*'; printf '%s\n' "$releases"; } | node scripts/release-target.js beta-newer "$BETA_VERSION"

      # The beta's CHANGELOG.md entry is its Release title and notes, so a missing or
      # empty entry stops the run here, before the builds.
      - name: Require the beta's CHANGELOG.md entry
        run: |
          set -euo pipefail
          if ! node scripts/changelog.js "$BETA_VERSION" > /dev/null; then
            echo "::error::CHANGELOG.md has no [$BETA_VERSION] entry, or it is empty. Write the beta's notes first."
            exit 1
          fi

  windows:
    name: windows
    needs: guard
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the beta version without committing it
        shell: pwsh
        run: |
          npm version "$env:BETA_VERSION" --no-git-tag-version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # A failing native command does not stop a pwsh step, so each one is checked.
      - name: Point this build at the beta feed
        shell: pwsh
        run: |
          node scripts/release-target.js beta "$env:BETA_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $betaRepo = (node -p "require('./scripts/channels').betaRepository").Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/set-update-repository.js $betaRepo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $feed = (node -p "require('./src/main/updater').UPDATE_REPOSITORY").Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $beta = (node -p "require('./scripts/channels').betaRepository").Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stable = (node -p "require('./scripts/channels').stableRepository").Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($feed -ne $beta -or $feed -eq $stable) {
            throw "Beta build feed is '$feed', not the beta repository."
          }

      - name: Build the Windows beta
        run: npm run make -- --platform=win32 --arch=x64

      # Squirrel orders betas by the text after the dash, so the nupkg must carry the
      # zero-padded number (2.0.0-beta010). Stop here if forge did not apply it.
      - name: Check the Squirrel version of the Windows beta
        shell: pwsh
        run: |
          $nuget = (node -p "require('./scripts/channels').squirrelVersion(process.env.BETA_VERSION)").Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $releases = Get-Content out/make/squirrel.windows/x64/RELEASES -Raw
          if ($releases -notmatch "-$([regex]::Escape($nuget))-full\.nupkg") {
            throw "RELEASES does not list Squirrel version $nuget, so betas would not sort by number:`n$releases"
          }

      - name: Upload the Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: out/make/squirrel.windows/x64
          if-no-files-found: error

  mac:
    name: mac
    needs: guard
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the beta version without committing it
        run: npm version "$BETA_VERSION" --no-git-tag-version

      - name: Point this build at the beta feed
        run: |
          set -euo pipefail
          node scripts/release-target.js beta "$BETA_VERSION"
          node scripts/set-update-repository.js "$(node -p "require('./scripts/channels').betaRepository")"
          node <<'NODE'
          const { UPDATE_REPOSITORY } = require('./src/main/updater');
          const { betaRepository, stableRepository } = require('./scripts/channels');
          if (UPDATE_REPOSITORY !== betaRepository || UPDATE_REPOSITORY === stableRepository) {
            throw new Error(`Beta build feed is ${UPDATE_REPOSITORY}, not the beta repository.`);
          }
          NODE

      # Every Mac beta is signed with the same self-signed certificate, so macOS keeps
      # the camera permission when a beta updates (an ad-hoc signature changes each
      # build). It comes from the two secrets scripts/create-mac-beta-signing-cert.sh
      # tells you to store. codesign finds an untrusted certificate only by its hash,
      # in an unlocked keychain that is on the search list and allows codesign's key
      # access. forge.config.js signs with MAC_BETA_SIGN_IDENTITY and _KEYCHAIN.
      - name: Import the Mac beta signing certificate
        env:
          SIGNING_P12: ${{ secrets.MAC_BETA_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.MAC_BETA_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_P12" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::MAC_BETA_SIGNING_P12 or MAC_BETA_SIGNING_PASSWORD is empty. Run scripts/create-mac-beta-signing-cert.sh and store the secrets it prints. If a certificate already exists, restore its secrets from the backup instead: a new one makes every tester allow the camera again."
            exit 1
          fi
          p12="$RUNNER_TEMP/mac-beta-signing.p12"
          keychain="$RUNNER_TEMP/mac-beta-signing.keychain-db"
          keychain_password=$(/usr/bin/openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$p12"
          # The certificate's SHA-1 is what codesign is given; this also proves the p12 and its password match.
          sha1=$(/usr/bin/openssl pkcs12 -in "$p12" -passin env:SIGNING_PASSWORD -clcerts -nokeys | /usr/bin/openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
          if [[ ! "$sha1" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the certificate in MAC_BETA_SIGNING_P12."
            exit 1
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do
            [[ "$line" == *\"* ]] || continue
            line="${line#*\"}"
            existing+=("${line%\"*}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" ${existing[@]+"${existing[@]}"}
          identities=$(security find-identity -p codesigning "$keychain")
          grep -qi -- "$sha1" <<< "$identities"
          rm -f "$p12"
          echo "MAC_BETA_SIGN_IDENTITY=$sha1" >> "$GITHUB_ENV"
          echo "MAC_BETA_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build Apple Silicon and Intel betas
        run: |
          set -euo pipefail
          version="$BETA_VERSION"
          mkdir -p "$RUNNER_TEMP/mac-beta"
          copy_zip() {
            local arch="$1"
            local found
            found=$(find "out/make/zip/darwin/$arch" -name '*.zip' -print -quit)
            test -n "$found"
            cp "$found" "$RUNNER_TEMP/mac-beta/media-art-for-windows-darwin-${arch}-${version}.zip"
          }
          npm run make -- --platform=darwin --arch=arm64
          copy_zip arm64
          npm run make -- --platform=darwin --arch=x64
          copy_zip x64

      # The zips are what testers get, so they are checked, not the packaged apps.
      # A cdhash requirement means the stable signature did not go on.
      - name: Check the Mac betas carry the stable signature
        run: |
          set -euo pipefail
          app=$(node -p "require('./scripts/channels').appBundle")
          expected="certificate leaf = H\"${MAC_BETA_SIGN_IDENTITY}\""
          for arch in arm64 x64; do
            dir="$RUNNER_TEMP/verify-$arch"
            rm -rf "$dir"
            mkdir -p "$dir"
            ditto -x -k "$RUNNER_TEMP/mac-beta/media-art-for-windows-darwin-${arch}-${BETA_VERSION}.zip" "$dir"
            codesign --verify --deep --strict --verbose=2 "$dir/$app"
            requirement=$(codesign -d -r- "$dir/$app" 2>&1)
            echo "$arch: $requirement"
            if [[ "$requirement" == *cdhash* || "$requirement" != *"$expected"* ]]; then
              echo "::error::The $arch beta's designated requirement is not $expected."
              exit 1
            fi
          done

      - name: Upload the Mac betas
        uses: actions/upload-artifact@v4
        with:
          name: mac-beta
          path: ${{ runner.temp }}/mac-beta
          if-no-files-found: error

      # Whether or not the build passed. The runner is thrown away, but the
      # certificate's private key should not sit in a keychain until then.
      - name: Delete the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/mac-beta-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || echo "::warning::Could not delete the signing keychain."
          fi
          rm -f "$RUNNER_TEMP/mac-beta-signing.p12"

  publish:
    name: publish to the beta repository
    needs: [guard, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Prints the repository and tag this beta goes to, and stops unless the
      # version is X.Y.Z-beta.N aimed at the beta repository, never the exhibit one.
      - name: Refuse the exhibit repository again
        id: target
        run: |
          set -euo pipefail
          node scripts/release-target.js beta "$BETA_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*-beta'
          merge-multiple: true
          path: dist

      # Every file a tester needs must be here before a release exists. A glob that
      # matches nothing is not an error in bash, so each one is checked by name.
      - name: Check the build files
        run: |
          set -euo pipefail
          nuget=$(node -p "require('./scripts/channels').squirrelVersion(process.env.BETA_VERSION)")
          missing=0
          need() {
            if ! compgen -G "$1" > /dev/null; then
              echo "::error::Missing build file: $1"
              missing=1
            fi
          }
          need "dist/RELEASES"
          need "dist/*Setup.exe"
          need "dist/*-${nuget}-full.nupkg"
          need "dist/media-art-for-windows-darwin-arm64-${BETA_VERSION}.zip"
          need "dist/media-art-for-windows-darwin-x64-${BETA_VERSION}.zip"
          test "$missing" -eq 0
          grep -qF -- "-${nuget}-full.nupkg" dist/RELEASES

      # The release stays a draft until the cask and the source tag are done, so the
      # update feed never sees half-uploaded files, and a failed run can be started
      # again from the top: the files, the cask hashes and the tag are all redone
      # together (--clobber replaces the draft's files).
      - name: Upload the beta as a draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
          repo: ${{ steps.target.outputs.repository }}
          tag: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # Title and notes come from the beta's CHANGELOG.md entry, then what is in the release.
          title=$(node scripts/changelog.js "$BETA_VERSION" dist/notes.md)
          cat >> dist/notes.md <<'NOTES'

          ---

          Windows 설치 파일과 Mac(Apple Silicon, Intel) 압축 파일이 들어 있습니다. 전시 PC에는 배포되지 않는 베타입니다.

          Mac은 Homebrew로도 설치할 수 있습니다: `brew install --cask BSSMAscending/tap/binary-media-art-beta`
          NOTES
          drafts=$(gh release list --repo "$repo" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')
          if grep -qxF "$tag" <<< "$drafts"; then
            gh release edit "$tag" --repo "$repo" --title "$title" --notes-file dist/notes.md
          else
            gh release create "$tag" --repo "$repo" --draft --title "$title" --notes-file dist/notes.md
          fi
          gh release upload "$tag" dist/*.zip dist/*.exe dist/*.nupkg dist/RELEASES --repo "$repo" --clobber

      # The guard job found the tap and checked that the token can push to it.
      - name: Update the Homebrew tap
        if: needs.guard.outputs.tap == 'present'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
          tap: ${{ steps.target.outputs.tap }}
        run: |
          set -euo pipefail
          version="$BETA_VERSION"
          arm=$(sha256sum "dist/media-art-for-windows-darwin-arm64-${version}.zip" | awk '{print $1}')
          intel=$(sha256sum "dist/media-art-for-windows-darwin-x64-${version}.zip" | awk '{print $1}')
          node scripts/beta-cask.js "$version" "$arm" "$intel" > dist/binary-media-art-beta.rb
          rm -rf tap-repo
          gh repo clone "$tap" tap-repo
          mkdir -p tap-repo/Casks
          cp dist/binary-media-art-beta.rb tap-repo/Casks/binary-media-art-beta.rb
          git -C tap-repo add Casks/binary-media-art-beta.rb
          git -C tap-repo -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" diff --cached --quiet && exit 0
          git -C tap-repo -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "beta: binary-media-art-beta ${version}"
          gh auth setup-git
          git -C tap-repo push origin HEAD:main

      - name: Tag the source commit
        env:
          tag: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      # Last, so a release only goes public once its files, the cask and the tag all
      # agree. If this step fails, publish the draft by hand; nothing else is missing.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
          repo: ${{ steps.target.outputs.repository }}
          tag: ${{ steps.target.outputs.tag }}
        run: gh release edit "$tag" --repo "$repo" --draft=false --latest
