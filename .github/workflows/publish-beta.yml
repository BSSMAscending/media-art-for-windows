name: Publish beta

# Manual only. Builds a Windows beta and a Mac beta (Apple Silicon and Intel)
# and publishes both to BSSMAscending/media-art-beta. The Homebrew tap is
# updated when that repository exists; a missing tap does not block the files.
# It does not run on pushes
# to main, does not change package.json on main, and cannot upload to the
# exhibit repository media-art-for-windows-releases. Exhibit PCs keep updating
# from that repository alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Beta on the 2.0.0 line, for example 2.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

# The version is typed by whoever runs the workflow. It reaches every script as
# an environment variable and is never pasted into script text.
env:
  BETA_VERSION: ${{ inputs.version }}

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  guard:
    name: refuse the exhibit repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Accept only a beta version aimed away from the exhibit
        run: node scripts/release-target.js beta "$BETA_VERSION"

      - name: Require the beta repository
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASES_REPOSITORY_TOKEN is not configured."
            exit 1
          fi
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { betaRepository, homebrewTap } = require('./scripts/channels');
          const { assertBetaVersion } = require('./scripts/release-target');
          const tag = assertBetaVersion(process.env.BETA_VERSION);
          execFileSync('gh', ['repo', 'view', betaRepository, '--json', 'visibility,isPrivate'], { stdio: 'inherit' });
          try {
            execFileSync('gh', ['repo', 'view', homebrewTap, '--json', 'visibility,isPrivate'], { stdio: 'inherit' });
          } catch (error) {
            if (error.status === undefined) throw error;
            console.warn(`Homebrew tap ${homebrewTap} is absent. The Mac and Windows files still publish.`);
          }
          try {
            execFileSync('git', ['rev-parse', '-q', '--verify', `refs/tags/${tag}`], { stdio: 'ignore' });
            throw new Error(`${tag} is already published. Pick the next beta number.`);
          } catch (error) {
            if (error.status !== 1) throw error;
          }
          NODE

  windows:
    name: windows
    needs: guard
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the beta version without committing it
        shell: pwsh
        run: npm version "$env:BETA_VERSION" --no-git-tag-version

      - name: Point this build at the beta feed
        shell: pwsh
        run: |
          node scripts/release-target.js beta "$env:BETA_VERSION"
          $betaRepo = (node -p "require('./scripts/channels').betaRepository").Trim()
          node scripts/set-update-repository.js $betaRepo
          $feed = (node -p "require('./src/main/updater').UPDATE_REPOSITORY").Trim()
          $beta = (node -p "require('./scripts/channels').betaRepository").Trim()
          $stable = (node -p "require('./scripts/channels').stableRepository").Trim()
          if ($feed -ne $beta -or $feed -eq $stable) {
            throw "Beta build feed is '$feed', not the beta repository."
          }

      - name: Build the Windows beta
        run: npm run make -- --platform=win32 --arch=x64

      - name: Upload the Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: out/make/squirrel.windows/x64
          if-no-files-found: error

  mac:
    name: mac
    needs: guard
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set the beta version without committing it
        run: npm version "$BETA_VERSION" --no-git-tag-version

      - name: Point this build at the beta feed
        run: |
          set -euo pipefail
          node scripts/release-target.js beta "$BETA_VERSION"
          node scripts/set-update-repository.js "$(node -p "require('./scripts/channels').betaRepository")"
          node <<'NODE'
          const { UPDATE_REPOSITORY } = require('./src/main/updater');
          const { betaRepository, stableRepository } = require('./scripts/channels');
          if (UPDATE_REPOSITORY !== betaRepository || UPDATE_REPOSITORY === stableRepository) {
            throw new Error(`Beta build feed is ${UPDATE_REPOSITORY}, not the beta repository.`);
          }
          NODE

      - name: Build Apple Silicon and Intel betas
        run: |
          set -euo pipefail
          version="$BETA_VERSION"
          mkdir -p "$RUNNER_TEMP/mac-beta"
          copy_zip() {
            local arch="$1"
            local found
            found=$(find "out/make/zip/darwin/$arch" -name '*.zip' -print -quit)
            test -n "$found"
            cp "$found" "$RUNNER_TEMP/mac-beta/media-art-for-windows-darwin-${arch}-${version}.zip"
          }
          npm run make -- --platform=darwin --arch=arm64
          copy_zip arm64
          npm run make -- --platform=darwin --arch=x64
          copy_zip x64

      - name: Upload the Mac betas
        uses: actions/upload-artifact@v4
        with:
          name: mac-beta
          path: ${{ runner.temp }}/mac-beta
          if-no-files-found: error

  publish:
    name: publish to the beta repository
    needs: [guard, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Prints the repository and tag this beta goes to, and stops unless the
      # version is X.Y.Z-beta.N aimed at the beta repository, never the exhibit one.
      - name: Refuse the exhibit repository again
        id: target
        run: |
          set -euo pipefail
          node scripts/release-target.js beta "$BETA_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*-beta'
          merge-multiple: true
          path: dist

      - name: Publish the beta release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
          repo: ${{ steps.target.outputs.repository }}
          tag: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          printf 'Beta %s. Windows installer and Mac zips. Not published to the exhibit repository.\n' "$BETA_VERSION" > dist/notes.md
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --title "$tag beta" --notes-file dist/notes.md
          fi
          shopt -s nullglob
          files=(dist/*.zip dist/*.exe dist/*.nupkg dist/RELEASES)
          test "${#files[@]}" -gt 0
          gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber

      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          version="$BETA_VERSION"
          tap=$(node -e "const {homebrewTap, stableRepository, betaRepository}=require('./scripts/channels'); if (homebrewTap===stableRepository || homebrewTap===betaRepository) process.exit(1); process.stdout.write(homebrewTap)")
          if ! gh repo view "$tap" --json name >/dev/null 2>&1; then
            echo "Homebrew tap $tap is absent. The Mac and Windows files are already published."
            exit 0
          fi
          arm=$(sha256sum "dist/media-art-for-windows-darwin-arm64-${version}.zip" | awk '{print $1}')
          intel=$(sha256sum "dist/media-art-for-windows-darwin-x64-${version}.zip" | awk '{print $1}')
          node scripts/beta-cask.js "$version" "$arm" "$intel" > dist/binary-media-art-beta.rb
          rm -rf tap-repo
          gh repo clone "$tap" tap-repo
          mkdir -p tap-repo/Casks
          cp dist/binary-media-art-beta.rb tap-repo/Casks/binary-media-art-beta.rb
          git -C tap-repo add Casks/binary-media-art-beta.rb
          git -C tap-repo -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" diff --cached --quiet && exit 0
          git -C tap-repo -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "beta: binary-media-art-beta ${version}"
          gh auth setup-git
          git -C tap-repo push origin HEAD:main

      - name: Tag the source commit
        env:
          tag: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
