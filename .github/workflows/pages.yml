name: Deploy project site

# Builds site/ with the README screenshots and a patch notes page generated from
# CHANGELOG.md (scripts/build-site.js), then publishes it to GitHub Pages.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/images/readme/**'
      - 'CHANGELOG.md'
      - 'CHANGELOG.en.md'
      - 'package.json'
      - 'scripts/build-site.js'
      - 'scripts/changelog.js'
      - 'scripts/channels.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses only Node built-ins, so no npm install is needed.
      - name: Build site
        run: node scripts/build-site.js _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
